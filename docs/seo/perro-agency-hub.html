<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<title>PERRO Agency — Migración técnica SEO/GEO</title>
<style>
  :root {
    --navy: #1E2761;
    --navy-2: #273575;
    --ice: #CADCFC;
    --white: #FFFFFF;
    --dark: #1A1A2E;
    --muted: #5A6072;
    --coral: #E76F51;
    --green: #2A9D8F;
    --cardbg: #F4F6FC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--dark);
    background: var(--navy);
    overflow: hidden;
  }
  .deck {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5vh 7vw;
    opacity: 0;
    transform: translateY(24px);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: var(--white);
    overflow-y: auto;
  }
  .slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .slide.dark { background: var(--navy); color: var(--white); }
  .slide-inner { max-width: 1180px; margin: 0 auto; width: 100%; }

  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .eyebrow.coral { color: var(--coral); }
  .eyebrow.green { color: var(--green); }
  .eyebrow.ice { color: var(--ice); }
  .eyebrow.muted { color: var(--muted); }

  h1.title { font-family: Cambria, Georgia, serif; font-size: clamp(28px, 4vw, 46px); font-weight: 700; margin: 0 0 14px; line-height: 1.15; }
  p.lead { font-size: clamp(14px, 1.3vw, 18px); color: var(--muted); max-width: 820px; line-height: 1.5; margin: 0 0 20px; }
  .dark p.lead { color: var(--ice); }

  .cards { display: grid; gap: 18px; margin-top: 22px; }
  .cards.cols-2 { grid-template-columns: 1fr 1fr; }
  .cards.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--cardbg);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .card.alt { background: #FDEDEA; }
  .card.green { background: #EAF3EF; }
  .card h3 { margin: 0 0 8px; font-size: 17px; color: var(--navy); }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .card .big { font-family: Cambria, Georgia, serif; font-weight: 700; font-size: 22px; color: var(--navy); margin: 4px 0; }
  .card.alt .big { color: var(--coral); }

  .file-badge {
    display: inline-block;
    font-family: "Courier New", monospace;
    font-size: 12px;
    background: var(--cardbg);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .filepath { font-family: "Courier New", monospace; }

  .btn-row { display: flex; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  button.btn {
    font-family: Calibri, sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s;
  }
  button.btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-secondary { background: var(--cardbg); color: var(--navy); }
  .btn-primary:hover, .btn-secondary:hover { opacity: 0.85; }
  .btn-ok { background: var(--green); color: var(--white); }

  pre.code {
    background: var(--navy);
    color: var(--ice);
    border-radius: 12px;
    padding: 20px 22px;
    font-family: "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    max-height: 44vh;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  .checklist { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; margin-top: 28px; }
  .checklist h4 { color: var(--navy); font-size: 15px; margin: 0 0 14px; }
  .check-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; cursor: pointer; user-select: none; }
  .box { width: 20px; height: 20px; min-width: 20px; border-radius: 5px; border: 1.5px solid #9AA5C8; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--green); font-weight: 700; }
  .check-item.done .box { background: #EAF3EF; border-color: var(--green); }
  .check-item span.label { font-size: 12.5px; color: var(--dark); line-height: 1.4; }
  .check-item.done span.label { color: var(--muted); text-decoration: line-through; }

  .filegrid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
  .filerow {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--navy-2); border-radius: 10px; padding: 16px 20px;
    flex-wrap: wrap; gap: 12px;
  }
  .filerow .name { font-family: "Courier New", monospace; font-weight: 700; color: var(--ice); font-size: 14px; }
  .filerow .desc { color: #C5CAE9; font-size: 12.5px; }

  .nav-dots {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 50;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.35); cursor: pointer; border: none; padding: 0; }
  .dot.active { background: var(--white); box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }

  .nav-arrows {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px; z-index: 50;
    background: rgba(26,26,46,0.85); padding: 8px 16px; border-radius: 30px;
    color: var(--white); font-size: 12px;
  }
  .nav-arrows button {
    background: rgba(255,255,255,0.12); border: none; color: var(--white);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px;
  }
  .nav-arrows button:hover { background: rgba(255,255,255,0.25); }
  .counter { min-width: 46px; text-align: center; opacity: 0.8; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--green); color: white; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ul.plain { margin: 10px 0; padding-left: 20px; color: var(--dark); font-size: 13.5px; line-height: 1.6; }
  .dark ul.plain { color: var(--ice); }
  .stat-num { font-family: Cambria, Georgia, serif; font-weight: 700; font-size: clamp(40px,5vw,64px); color: var(--white); margin: 6px 0; }

  @media (max-width: 860px) {
    .cards.cols-2, .cards.cols-3 { grid-template-columns: 1fr; }
    .checklist { grid-template-columns: 1fr; }
    .nav-dots { display: none; }
  }
</style>
</head>

 en Google Ads, Meta Ads y TikTok Ads, con foco en ROAS (e-commerce) y CAC/LTV (SaaS). Más de USD 112M gestionados en inversión publicitaria.\n- Growth Marketing: adquisición de clientes, testing constante y optimización de embudos de conversión (ver detalle en Servicios).\n\n## Empresa\n\n- [Nosotros](https://www.perroagency.com/nosotros): Quiénes son, su equipo y su forma de trabajar.\n- [Portfolio](https://www.perroagency.com/portfolio): Casos y clientes con los que trabajaron.\n- [Contacto](https://www.perroagency.com/contacto): Formulario de contacto y datos para coordinar una reunión.\n\nUbicación: Buenos Aires, Argentina. Trabajan con clientes en toda Latinoamérica y a nivel global.\n\n## Casos y clientes\n\nTrabajan con e-commerce, startups y marcas en crecimiento que buscan escalar su adquisición de clientes. Entre sus clientes: Tiendanube, para quien combinaron branding, performance y growth en el desarrollo y escalado de su estrategia de marketing.\n\n## Blog\n\n- [Blog](https://www.perroagency.com/blog): Artículos sobre marketing digital, SEO, SEM, UX/UI y publicidad online.\n\n## Preguntas frecuentes\n\n**¿Qué es el performance marketing?** Es un enfoque de marketing basado en resultados medibles como ventas, leads o conversiones, trabajando con plataformas como Meta Ads, Google Ads y TikTok Ads y optimizando campañas de forma continua.\n\n**¿Qué diferencia a una agencia de performance de una agencia tradicional?** Una agencia de performance se enfoca en resultados concretos y medibles, mientras que una agencia tradicional suele priorizar creatividad o visibilidad sin un vínculo directo con las ventas.\n\n**¿Qué diferencia a PERRO de otras agencias?** PERRO combina branding, performance y growth en un mismo sistema, buscando no solo generar visibilidad sino también escalar ventas y construir marcas sólidas a largo plazo.\n\n**¿Qué tipo de empresas trabajan con PERRO?** E-commerce, startups y marcas en crecimiento que buscan escalar mediante estrategias function render() {

}
function goTo(i) { current = Math.max(0, Math.min(slides.length - 1, i)); render(); }
document.getElementById('prevBtn').onclick = () => goTo(current - 1);
document.getElementById('nextBtn').onclick = () => goTo(current + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});
let touchX = null;
document.addEventListener('touchstart', (e) => touchX = e.touches[0].clientX);
document.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx > 50) goTo(current - 1);
  if (dx < -50) goTo(current + 1);
  touchX = null;
});
render();
</script>
</body>
</html>
